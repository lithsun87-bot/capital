<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>เที่ยวกรุงเทพ VR</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ทัวร์กรุงเทพแบบ VR บนเบราว์เซอร์ ด้วย three.js และ WebXR">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--fg:#1b1f2a;--glass:rgba(255,248,238,.84);--acc:#c2561a;--bd:rgba(27,31,42,.2);--bg:#2a2230}
@media (prefers-color-scheme:dark){:root{--fg:#fff4e6;--glass:rgba(24,20,32,.7);--acc:#ffb347;--bd:rgba(255,255,255,.22)}}
html,body{height:100%;margin:0;background:var(--bg);font-family:"Noto Sans Thai",Sarabun,Tahoma,sans-serif;overflow:hidden}
canvas{display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box;padding:max(12px,env(safe-area-inset-top,0px)) 12px max(12px,env(safe-area-inset-bottom,0px))}
body.inxr #ui{display:none}
.glass{background:var(--glass);color:var(--fg);border:1px solid var(--bd);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
header{display:flex;align-items:center;gap:8px}
h1{font-size:1.1rem;margin:0;padding:8px 14px;font-weight:600}
button{pointer-events:auto;font:inherit;color:var(--fg);cursor:pointer}
#snd{padding:8px 12px}
#snd[aria-pressed="true"]{background:var(--acc);color:#1b1206;border-color:transparent;font-weight:600}

#card p{margin:4px 0 0;font-size:.9rem;line-height:1.6}
#card .tip{color:var(--acc);font-weight:600}
#bar{display:flex;gap:8px;flex-wrap:wrap}
#bar button{padding:9px 14px;border-radius:12px}
#bar button.on{background:var(--acc);color:#1b1206;border-color:transparent;font-weight:600}
#hint{margin:8px 0 0;font-size:.78rem;color:#fff;text-shadow:0 1px 3px #000}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
/* ปุ่ม Enter VR ของ three.js ย้ายไปมุมขวาบน */
#VRButton{top:max(12px,env(safe-area-inset-top,0px))!important;bottom:auto!important;left:auto!important;right:12px!important;border-radius:14px!important}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<div id="ui">

    <h1 class="glass">เที่ยวกรุงเทพ VR</h1>
    <button id="snd" class="glass" aria-pressed="false">เปิดเสียง</button>
  </header>
  <div>
    <section id="card" class="glass" aria-live="polite">
      <h2 id="cn"></h2><p id="cd"></p><p id="ct" class="tip"></p>
    </section>
    <nav id="bar" aria-label="เลือกสถานที่"></nav>
    <p id="hint">ลากเพื่อมองรอบตัว แตะลูกแสงสีส้มหรือกดปุ่มเพื่อเดินทางไปจุดอื่น</p>
  </div>
</div>
<script type="module">
import * as T from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';

/* ===== data ===== */
// จุดท่องเที่ยว: p = ตำแหน่งตา (x,y,z), t = จุดที่มอง
// เพิ่มสถานที่ใหม่ได้โดยเพิ่มวัตถุในอาร์เรย์นี้ แล้วสร้างฉากใน world.js
const RAW = [
  { n:'ท่าเรือเจ้าพระยา', s:'ท่าเรือ', p:[0,2,15], t:[-18,12,-40],
    d:'จุดเริ่มต้นริมแม่น้ำเจ้าพระยา สายน้ำหลักของกรุงเทพฯ เรือโดยสารและเรือหางยาวแล่นผ่านตลอดวัน',
    tip:'ลองนั่งเรือด่วนธงส้มไปตามจุดท่องเที่ยวริมน้ำ' },
  { n:'วัดอรุณราชวราราม', s:'วัดอรุณฯ', p:[-20,1.6,-18], t:[-20,14,-40],
    d:'พระปรางค์องค์ใหญ่ริมฝั่งธนบุรี ประดับด้วยกระเบื้องและเปลือกหอยหลากสี งดงามที่สุดตอนพระอาทิตย์ตก',
    tip:'ข้ามฟากจากท่าเตียนด้วยเรือข้ามฟากราคาไม่กี่บาท' },
  { n:'พระบรมมหาราชวัง', s:'พระบรมมหาราชวัง', p:[22,1.6,22], t:[26,9,46],
    d:'สร้างเมื่อ พ.ศ. 2325 ในรัชกาลที่ 1 เป็นที่ตั้งของพระที่นั่ง พระมหาเจดีย์ทอง และวัดพระแก้ว',
    tip:'แต่งกายสุภาพ ปิดไหล่และเข่าก่อนเข้าชม' },
  { n:'รถไฟฟ้า BTS', s:'BTS', p:[6,9.6,80], t:[-40,9,85],
    d:'รถไฟฟ้ายกระดับที่เปิดให้บริการตั้งแต่ปี 2542 พาข้ามรถติดไปย่านสยาม สุขุมวิท และสีลมได้อย่างรวดเร็ว',
    tip:'ซื้อบัตรเที่ยวเดียวหรือแตะบัตรโดยสารที่ตู้อัตโนมัติ' }
];

// ป้ายลอยในฉาก: [หัวข้อ, คำบรรยาย, ความกว้าง, x, y, z]
const LABELS = [
  ['วัดอรุณราชวราราม','พระปรางค์ริมแม่น้ำ ฝั่งธนบุรี',16,-20,13,-24],
  ['พระบรมมหาราชวัง','สร้างเมื่อ พ.ศ. 2325',16,18,11,36],
  ['สถานี BTS','รถไฟฟ้ายกระดับ',9,6,15,79],
  ['แม่น้ำเจ้าพระยา','สายน้ำหลักของกรุงเทพฯ',12,0,6,6]
];

/* ===== audio ===== */
// เสียงบรรยากาศสร้างด้วย Web Audio: เสียงน้ำ (noise กรองความถี่ต่ำ) และระฆังวัดเบาๆ
function createAmbience() {
  let ctx, on = false;
  function start() {
    ctx = new AudioContext();
    const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 600;
    const g = ctx.createGain(); g.gain.value = 0.5;
    src.connect(lp).connect(g).connect(ctx.destination); src.start();
    setInterval(bell, 9000);
  }
  function bell() {
    if (!ctx || !on) return;
    const t = ctx.currentTime;
    [523, 785, 1046].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.08 / (i + 1), t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 4);
      o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 4.2);
    });
  }
  return { toggle() { if (!ctx) start(); on = !on; on ? ctx.resume() : ctx.suspend(); return on; } };
}

/* ===== world ===== */

const FONT = '"Noto Sans Thai",Sarabun,Tahoma,sans-serif';

/* ---------- helpers ---------- */
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const M = (c, e = 0) => new T.MeshLambertMaterial({ color: c, emissive: e });
const box = (w, h, d, m) => new T.Mesh(new T.BoxGeometry(w, h, d), m);
const put = (o, x, y, z, parent) => { o.position.set(x, y, z); parent.add(o); return o; };
const cvs = (w, h) => Object.assign(document.createElement('canvas'), { width: w, height: h });
const tex = c => { const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; return t; };

function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

/* ---------- builders ---------- */
function lighting(scene) {
  scene.fog = new T.Fog(0xe9ab78, 80, 320);
  scene.add(new T.HemisphereLight(0xffe2c0, 0x4a3b45, 2.4));
  const sun = new T.DirectionalLight(0xffc27a, 2.6);
  sun.position.set(40, 70, 10); scene.add(sun);
}

function sky(scene) {
  const c = cvs(2, 256), g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  [[0, '#1c2554'], [.35, '#6a7fb5'], [.48, '#ffc283'], [.5, '#ffd9a0'], [.52, '#c98a5a'], [1, '#3a2a28']]
    .forEach(s => gr.addColorStop(s[0], s[1]));
  g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
  scene.add(new T.Mesh(new T.SphereGeometry(600, 24, 24),
    new T.MeshBasicMaterial({ map: tex(c), side: T.BackSide, fog: false })));
  put(new T.Mesh(new T.SphereGeometry(22, 24, 24), new T.MeshBasicMaterial({ color: 0xfff0c8, fog: false })), -150, 45, -300, scene);

  const clouds = [], cm = new T.MeshBasicMaterial({ color: 0xffd3b0, transparent: true, opacity: .85, fog: false });
  for (let i = 0; i < 8; i++) {
    const cl = new T.Group();
    for (let k = 0; k < 4; k++) {
      const s = new T.Mesh(new T.SphereGeometry(10 + rnd() * 10, 12, 8), cm);
      s.scale.y = .4; put(s, k * 14 - 20, rnd() * 4, rnd() * 8, cl);
    }
    cl.position.set(rnd() * 600 - 300, 90 + rnd() * 40, -150 - rnd() * 150);
    scene.add(cl); clouds.push(cl);
  }
  return clouds;
}

function groundAndRiver(scene) {
  const ground = new T.Mesh(new T.PlaneGeometry(700, 700), M(0x6d6a5a)); ground.rotation.x = -Math.PI / 2;
  put(ground, 0, -.05, 0, scene);
  const c = cvs(256, 256), g = c.getContext('2d');
  g.fillStyle = '#4d7a82'; g.fillRect(0, 0, 256, 256);
  g.strokeStyle = 'rgba(255,220,170,.35)'; g.lineWidth = 2;
  for (let i = 0; i < 60; i++) { const x = rnd() * 256, y = rnd() * 256; g.beginPath(); g.moveTo(x, y); g.lineTo(x + 20 + rnd() * 30, y); g.stroke(); }
  const water = tex(c); water.wrapS = water.wrapT = T.RepeatWrapping; water.repeat.set(30, 2.5);
  const river = new T.Mesh(new T.PlaneGeometry(700, 28), new T.MeshLambertMaterial({ map: water })); river.rotation.x = -Math.PI / 2;
  put(river, 0, .02, 0, scene);
  // ถนนฝั่งพระบรมมหาราชวัง
  const road = new T.Mesh(new T.PlaneGeometry(400, 6), M(0x3a3a40)); road.rotation.x = -Math.PI / 2;
  put(road, 0, .03, 28, scene);
  return water;
}

function pier(scene) {
  const w = M(0x7b5a3c);
  put(box(6, .4, 9, w), 0, .3, 11, scene);
  for (let i = 0; i < 4; i++) put(box(.3, 1.6, .3, w), i % 2 ? 2.7 : -2.7, .2, i < 2 ? 7 : 15, scene);
}

function prang(h, r, stone, gold) {
  const g = new T.Group(); let y = 0; const n = 6;
  for (let i = 0; i < n; i++) {
    const th = h / n * .8, rr = r * (1 - i * .14);
    put(new T.Mesh(new T.CylinderGeometry(rr * 1.06, rr * 1.06, .35, 8), stone), 0, y + .17, 0, g);
    put(new T.Mesh(new T.CylinderGeometry(rr * .8, rr, th, 8), i % 2 ? M(0xe6dcc8) : stone), 0, y + th / 2, 0, g);
    y += th;
  }
  put(new T.Mesh(new T.ConeGeometry(r * .2, h * .36, 8), gold), 0, y + h * .18, 0, g);
  return g;
}

function watArun(scene) {
  const a = new T.Group(), stone = M(0xf0e8d6), gold = M(0xd9a441, 0x3a2a08);
  put(box(26, 2, 26, M(0xd8cdb4)), 0, 1, 0, a);
  for (let i = 0; i < 6; i++) { const h = 2 - i * .33; put(box(8, h, .9, M(0xd8cdb4)), 0, h / 2, 13.4 + i * .9, a); } // บันได
  put(prang(26, 5.2, stone, gold), 0, 2, 0, a);
  [[-9, -9], [9, -9], [-9, 9], [9, 9]].forEach(p => put(prang(12, 2.3, stone, gold), p[0], 2, p[1], a));
  a.position.set(-20, 0, -40); scene.add(a);
}

function palace(scene) {
  const p = new T.Group(), wall = M(0xf4efe4), red = M(0xb5381f), gold = M(0xe0a93c, 0x4a3208);
  [-15, 15].forEach(z => put(box(60, 3.5, 1.2, wall), 0, 1.75, z, p));
  [-30, 30].forEach(x => put(box(1.2, 3.5, 30, wall), x, 1.75, 0, p));
  put(box(16, 6, 10, wall), -8, 3, 0, p);
  [0, 1, 2].forEach(i => {
    const c = new T.Mesh(new T.ConeGeometry(11 - i * 2.6, 4, 4), i % 2 ? gold : red);
    c.rotation.y = Math.PI / 4; put(c, -8, 8 + i * 3, 0, p);
  });
  put(new T.Mesh(new T.ConeGeometry(.5, 6, 6), gold), -8, 20, 0, p);
  const bell = [[0, 0], [4, 0], [3.4, 3], [2.4, 7], [1.7, 11], [1.1, 14], [.6, 15]].map(v => new T.Vector2(v[0], v[1]));
  [12, 24].forEach(x => {
    put(new T.Mesh(new T.LatheGeometry(bell, 16), gold), x, 0, 0, p);
    put(new T.Mesh(new T.ConeGeometry(.5, 6, 8), gold), x, 17.5, 0, p);
  });
  put(box(22, 5, 10, M(0xe8dcc0)), -8, 2.5, -8, p);
  p.position.set(26, 0, 46); scene.add(p);
}

function bts(scene) {
  const con = M(0x9a9a9f);
  put(box(150, .8, 4, con), 0, 7.6, 85, scene);
  for (let x = -70; x <= 70; x += 10) put(box(1.2, 7.6, 1.2, con), x, 3.8, 85, scene);
  put(box(24, .4, 6, M(0xc9c3b8)), 6, 7.9, 79, scene);
  put(box(24, .3, 7, M(0x2d6f8f)), 6, 12, 79, scene);
  [-5, 17].forEach(x => put(box(.3, 4, .3, con), x, 9.9, 79, scene));
  const train = new T.Group();
  for (let i = 0; i < 3; i++) {
    put(box(9, 3, 3, M(0xe9ecef)), i * 9.4, 0, 0, train);
    put(box(9.01, .6, 3.02, M(0x3cb371)), i * 9.4, -.3, 0, train);
    put(box(9.02, .8, 3.02, M(0x1b3d5a, 0x0a1830)), i * 9.4, .7, 0, train);
  }
  train.position.set(-70, 9.5, 85); scene.add(train);
  return train;
}

function longtailBoat(scene) {
  const b = new T.Group();
  put(box(9, 1, 2, M(0x8b3a1e)), 0, .5, 0, b);
  put(box(4, 1.8, 1.8, M(0xf2d6a2)), -1, 1.9, 0, b);
  put(box(5, .2, 2.4, M(0x2f6f5f)), -1, 3, 0, b);
  const pole = new T.Mesh(new T.CylinderGeometry(.08, .08, 3, 6), M(0x333333)); pole.rotation.z = 1.2; put(pole, 5.2, 1.2, 0, b);
  put(box(.05, .8, 1.2, M(0xff7a1a)), -4, 3.6, 0, b);
  b.position.set(-60, 0, 3); scene.add(b);
  return b;
}

function tukTuk(color) {
  const g = new T.Group(), dark = M(0x222226);
  put(box(2.4, .8, 1.4, M(color)), 0, .85, 0, g);
  put(box(1.9, .12, 1.6, dark), -.2, 2.1, 0, g);
  [[-.9, -.7], [-.9, .7], [.5, -.7], [.5, .7]].forEach(p => put(box(.08, 1.1, .08, dark), p[0], 1.5, p[1], g));
  put(box(.9, .5, 1.3, M(color)), 1.5, .6, 0, g);
  const wheel = new T.CylinderGeometry(.35, .35, .2, 12);
  [[1.6, 0], [-.9, -.7], [-.9, .7]].forEach(p => { const w = new T.Mesh(wheel, dark); w.rotation.x = Math.PI / 2; put(w, p[0], .35, p[1], g); });
  return g;
}

function street(scene) {
  const colors = [0xf2c230, 0x37b36b, 0xe86ca0], tuks = [];
  colors.forEach((c, i) => {
    const t = tukTuk(c), dir = i % 2 ? -1 : 1;
    t.userData = { dir, speed: 6 + i * 1.5, off: i * 55 };
    t.rotation.y = dir > 0 ? 0 : Math.PI;
    t.position.z = dir > 0 ? 27 : 29.5;
    scene.add(t); tuks.push(t);
  });
  const post = M(0x2a2a2e), bulb = new T.MeshBasicMaterial({ color: 0xffd9a0, fog: false });
  for (let x = -80; x <= 80; x += 20) {
    put(new T.Mesh(new T.CylinderGeometry(.12, .12, 5, 6), post), x, 2.5, 24.6, scene);
    put(new T.Mesh(new T.SphereGeometry(.4, 10, 10), bulb), x, 5.1, 24.6, scene);
  }
  return tuks;
}

function city(scene) {
  const c = cvs(64, 128), g = c.getContext('2d');
  g.fillStyle = '#4b5470'; g.fillRect(0, 0, 64, 128);
  for (let y = 4; y < 124; y += 10) for (let x = 4; x < 60; x += 10) { g.fillStyle = rnd() < .35 ? '#ffd58a' : '#2c3350'; g.fillRect(x, y, 6, 6); }
  const bm = new T.MeshLambertMaterial({ map: tex(c), emissive: 0x1a1408 });
  const zone = (x0, x1, z0, z1, n) => {
    for (let i = 0; i < n; i++) {
      const w = 8 + rnd() * 14, h = 14 + rnd() * 70;
      put(box(w, h, w, bm), x0 + rnd() * (x1 - x0), h / 2, z0 + rnd() * (z1 - z0), scene);
    }
  };
  zone(-200, 200, -200, -85, 28); zone(-200, -60, -70, 130, 22);
  zone(70, 200, -70, 130, 22); zone(-200, 200, 100, 200, 26);
}

/* ---------- public API ---------- */
function buildWorld(scene) {
  lighting(scene);
  const clouds = sky(scene), water = groundAndRiver(scene);
  pier(scene); watArun(scene); palace(scene); city(scene);
  const train = bts(scene), boat = longtailBoat(scene), tuks = street(scene);
  const labels = [];

  function addLabels() {
    LABELS.forEach(([a, b, w, x, y, z]) => {
      const c = cvs(1024, 320), g = c.getContext('2d');
      g.fillStyle = 'rgba(24,20,32,.78)'; roundRect(g, 8, 8, 1008, 304, 44); g.fill();
      g.strokeStyle = '#ffb347'; g.lineWidth = 6; g.stroke();
      g.textAlign = 'center';
      g.fillStyle = '#ffb347'; g.font = '600 92px ' + FONT; g.fillText(a, 512, 134);
      g.fillStyle = '#fff4e6'; g.font = '400 56px ' + FONT; g.fillText(b, 512, 236);
      const m = new T.Mesh(new T.PlaneGeometry(w, w * .3125),
        new T.MeshBasicMaterial({ map: tex(c), transparent: true, fog: false, side: T.DoubleSide }));
      put(m, x, y, z, scene); labels.push(m);
    });
  }

  function update(t, dt, camPos) {
    water.offset.x = t * .004;
    train.position.x = -80 + ((t * 9) % 170);
    boat.position.x = -70 + ((t * 3.2) % 150);
    boat.position.y = Math.sin(t * 2) * .08;
    tuks.forEach(k => { const u = k.userData; k.position.x = u.dir * (((t * u.speed + u.off) % 220) - 110); });
    clouds.forEach(c => { c.position.x += dt * 2; if (c.position.x > 320) c.position.x = -320; });
    labels.forEach(l => { l.rotation.y = Math.atan2(camPos.x - l.position.x, camPos.z - l.position.z); });
  }

  return { addLabels, update };
}

/* ===== main ===== */

const $ = id => document.getElementById(id);
const SPOTS = RAW.map(o => ({ ...o, p: new T.Vector3(...o.p), t: new T.Vector3(...o.t) }));

/* ---------- renderer / scene ---------- */
const renderer = new T.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

const scene = new T.Scene();
const camera = new T.PerspectiveCamera(70, innerWidth / innerHeight, .1, 900);
const rig = new T.Group(); rig.add(camera); scene.add(rig);
const world = buildWorld(scene);
(document.fonts ? document.fonts.load('600 40px "Noto Sans Thai"').catch(() => {}) : Promise.resolve()).then(world.addLabels);

/* ---------- hotspots + reticle ---------- */
const orbs = SPOTS.map((s, i) => {
  const o = new T.Mesh(new T.SphereGeometry(.45, 20, 20), new T.MeshBasicMaterial({ color: 0xffa733, fog: false }));
  const halo = new T.Mesh(new T.RingGeometry(.7, .85, 32),
    new T.MeshBasicMaterial({ color: 0xffe0a0, transparent: true, opacity: .8, side: T.DoubleSide, fog: false }));
  halo.rotation.x = -Math.PI / 2; halo.raycast = () => {}; o.add(halo);
  o.userData = { i, halo };
  o.position.set(s.p.x, s.p.y - .8, s.p.z); scene.add(o);
  return o;
});
const reticle = (geo, op) => {
  const m = new T.Mesh(geo, new T.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: op, depthTest: false, fog: false }));
  m.position.z = -1.2; m.renderOrder = 999; m.visible = false; camera.add(m); return m;
};
const ring = reticle(new T.RingGeometry(.012, .018, 24), .9);
const fill = reticle(new T.CircleGeometry(.03, 24), .8); fill.material.color.set(0xffa733);

/* ---------- navigation ---------- */
let cur = 0, yaw = 0, pitch = 0, dwell = 0, gaze = -1;
const target = new T.Vector3(), bar = $('bar');
SPOTS.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'glass'; b.textContent = s.s; b.onclick = () => go(i); bar.appendChild(b);
});

function go(i, snap) {
  cur = i;
  const s = SPOTS[i], inVR = renderer.xr.isPresenting;
  target.set(s.p.x, s.p.y - (inVR ? 1.6 : 0), s.p.z);
  if (snap) rig.position.copy(target);
  const dx = s.t.x - s.p.x, dz = s.t.z - s.p.z, dy = s.t.y - s.p.y;
  yaw = Math.atan2(-dx, -dz);
  pitch = Math.max(-.3, Math.min(.5, Math.atan2(dy, Math.hypot(dx, dz))));
  rig.rotation.y = inVR ? yaw : 0;
  $('cn').textContent = s.n; $('cd').textContent = s.d; $('ct').textContent = 'เคล็ดลับ: ' + s.tip;
  [...bar.children].forEach((b, k) => b.classList.toggle('on', k === i));
  orbs.forEach((o, k) => { o.visible = k !== i; });
}
go(0, true);

renderer.xr.addEventListener('sessionstart', () => { document.body.classList.add('inxr'); go(cur, true); });
renderer.xr.addEventListener('sessionend', () => {
  document.body.classList.remove('inxr'); ring.visible = fill.visible = false; go(cur, true);
});
for (let k = 0; k < 2; k++) {
  const c = renderer.xr.getController(k); rig.add(c);
  c.addEventListener('select', () => { if (gaze >= 0) go(gaze); });
}

/* ---------- pointer: ลากเพื่อมอง / แตะลูกแสง ---------- */
const rc = new T.Raycaster(), el = renderer.domElement;
let down = null;
el.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, moved: 0 }; });
el.addEventListener('pointermove', e => {
  if (!down) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y;
  down.moved += Math.abs(dx) + Math.abs(dy); down.x = e.clientX; down.y = e.clientY;
  yaw += dx * .005; pitch = Math.max(-1.2, Math.min(1.2, pitch + dy * .005));
});
el.addEventListener('pointerup', e => {
  if (down && down.moved < 6) {
    rc.setFromCamera({ x: e.clientX / innerWidth * 2 - 1, y: -(e.clientY / innerHeight) * 2 + 1 }, camera);
    const hit = rc.intersectObjects(orbs.filter(o => o.visible))[0];
    if (hit) go(hit.object.userData.i);
  }
  down = null;
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});

/* ---------- เสียง ---------- */
const amb = createAmbience(), snd = $('snd');
snd.onclick = () => { const on = amb.toggle(); snd.setAttribute('aria-pressed', on); snd.textContent = on ? 'ปิดเสียง' : 'เปิดเสียง'; };

/* ---------- loop ---------- */
const clock = new T.Clock(), camPos = new T.Vector3(), camDir = new T.Vector3();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime, xr = renderer.xr.isPresenting;
  rig.position.lerp(target, 1 - Math.pow(.03, dt));
  if (!xr) camera.rotation.set(pitch, yaw, 0, 'YXZ');
  camera.getWorldPosition(camPos); camera.getWorldDirection(camDir);
  world.update(t, dt, camPos);
  orbs.forEach((o, k) => o.userData.halo.scale.setScalar(1 + .15 * Math.sin(t * 3 + k)));

  gaze = -1; ring.visible = xr;
  if (xr) {
    rc.ray.origin.copy(camPos); rc.ray.direction.copy(camDir);
    const hit = rc.intersectObjects(orbs.filter(o => o.visible))[0];
    if (hit) gaze = hit.object.userData.i;
    dwell = gaze >= 0 ? dwell + dt : 0;
    fill.visible = gaze >= 0; fill.scale.setScalar(Math.min(dwell / 1.4, 1));
    if (dwell >= 1.4) { go(gaze); dwell = 0; }
  }
  renderer.render(scene, camera);
});
</script>
</body>
</html>
